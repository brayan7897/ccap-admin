name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/brayan7897/ccap-admin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # NEXT_PUBLIC_API_URL se inyecta en build-time porque Next.js
          # la incrusta en el bundle de JavaScript.
          # Define esta variable como Repository Secret en:
          # GitHub → Settings → Secrets and variables → Actions
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ccapglobal.com/api/v1
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=542932674912-6hg2kkv5mibodjd5pof6nbsq7e471gin.apps.googleusercontent.com
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export KUBECONFIG=/home/ccap-deploy/.kube/config
            kubectl set image deployment/ccap-admin ccap-admin=${{ env.IMAGE_NAME }}:${{ github.sha }} -n ccap
            kubectl rollout status deployment/ccap-admin -n ccap --timeout=120s

      - name: Diagnose on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export KUBECONFIG=/home/ccap-deploy/.kube/config
            echo "=== Pods ==="
            kubectl get pods -n ccap -l app=ccap-admin
            echo "=== Describe deployment ==="
            kubectl describe deployment ccap-admin -n ccap
            echo "=== Pod events ==="
            kubectl get events -n ccap --sort-by='.lastTimestamp' | tail -20
            echo "=== Pod logs ==="
            kubectl logs -l app=ccap-admin -n ccap --tail=50 || true
            kubectl logs -l app=ccap-admin -n ccap --previous --tail=50 || true
